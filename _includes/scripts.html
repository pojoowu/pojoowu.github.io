<!-- main.min.js and theme-toggle.js are loaded with `defer` from head/custom.html.
     A synchronous external script here made Chrome ignore the render-blocking
     <link rel="expect"> marker, so the first paint happened before the bundle ran. -->

<script>
  /* Open links to other sites, and PDFs, in a new tab so readers keep this
     page. Runs at the end of <body>; changes no layout. */
  (function () {
    var host = location.hostname;
    var links = document.querySelectorAll('a[href]');
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      var external = /^https?:/i.test(a.getAttribute('href')) && a.hostname && a.hostname !== host;
      var pdf = /\.pdf(\?|#|$)/i.test(a.pathname || '');
      if ((external || pdf) && !a.target) {
        a.target = '_blank';
        a.rel = (a.rel ? a.rel + ' ' : '') + 'noopener';
      }
    }
  })();
</script>

<script>
  /* "Details" / "Cite" toggles in publication lists: a box slides open under
     the row; opening one box closes any other box of the same row. Boxes are
     `hidden` in the HTML (nothing shows without JavaScript); here they switch
     to a collapsible state animated by CSS (.pub__box--collapsible / .is-open). */
  (function () {
    var boxes = document.querySelectorAll('.pub__box[hidden]');
    for (var i = 0; i < boxes.length; i++) {
      boxes[i].hidden = false;
      boxes[i].classList.add('pub__box--collapsible');
      boxes[i].setAttribute('aria-hidden', 'true');
    }
    function setOpen(box, open) {
      box.classList.toggle('is-open', open);
      box.setAttribute('aria-hidden', String(!open));
    }
    /* "Copy BibTeX" on paper pages */
    document.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('.copy-btn');
      if (!btn) return;
      var src = document.getElementById(btn.getAttribute('data-copy-target'));
      if (!src || !navigator.clipboard) return;
      navigator.clipboard.writeText(src.textContent).then(function () {
        var label = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check" aria-hidden="true"></i>Copied';
        setTimeout(function () { btn.innerHTML = label; }, 1500);
      });
    });
    document.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('.pub__toggle');
      if (!btn) return;
      var box = document.getElementById(btn.getAttribute('aria-controls'));
      if (!box) return;
      var willOpen = !box.classList.contains('is-open');
      var row = btn.closest('.pub') || document;
      row.querySelectorAll('.pub__box.is-open').forEach(function (b) { setOpen(b, false); });
      row.querySelectorAll('.pub__toggle[aria-expanded="true"]').forEach(function (t) { t.setAttribute('aria-expanded', 'false'); });
      if (willOpen) {
        setOpen(box, true);
        btn.setAttribute('aria-expanded', 'true');
      }
    });
  })();
</script>

<script>
  /* Topic filters on the publications page (#pub-filters). Buttons toggle;
     several can be active and a paper stays visible only if it carries every
     active topic (intersection). Each button's count shows how many papers
     would remain if it were pressed on top of the current selection, and a
     button that would leave none is dimmed. Year sections with nothing left
     are hidden, the selection is mirrored in the URL hash (#a+b) so a
     filtered view can be linked, and rows re-enter with a short rise. Without
     JavaScript the page shows every paper. The hash deliberately contains only
     id characters and "+": the theme's smooth-scroll plugin passes every
     clicked link's fragment through a jQuery selector, and "=" or "," would
     throw there. */
  (function () {
    var bar = document.getElementById('pub-filters');
    if (!bar) return;
    var buttons = Array.prototype.slice.call(bar.querySelectorAll('.filter[data-topic]'));
    var clear = bar.querySelector('[data-clear]');
    var status = bar.querySelector('.filters__status');
    var empty = document.getElementById('pub-empty');
    var items = Array.prototype.slice.call(document.querySelectorAll('.year-group .list__item'));
    var groups = Array.prototype.slice.call(document.querySelectorAll('.year-group'));
    var main = document.getElementById('main');
    var topicsOf = items.map(function (it) { return (it.getAttribute('data-topics') || '').split(/\s+/); });

    function active() {
      return buttons.filter(function (b) { return b.getAttribute('aria-pressed') === 'true'; })
                    .map(function (b) { return b.getAttribute('data-topic'); });
    }
    function matches(topics, sel) {
      return sel.every(function (t) { return topics.indexOf(t) !== -1; });
    }
    function apply(fromClick) {
      var sel = active(), shown = 0;
      items.forEach(function (it, i) {
        var show = matches(topicsOf[i], sel);
        it.hidden = !show;
        if (show) shown++;
      });
      buttons.forEach(function (b) {
        var t = b.getAttribute('data-topic');
        var withT = sel.indexOf(t) === -1 ? sel.concat([t]) : sel;
        var n = topicsOf.filter(function (topics) { return matches(topics, withT); }).length;
        var count = b.querySelector('.filter__count');
        if (count) count.textContent = n;
        b.classList.toggle('filter--none', n === 0);
      });
      groups.forEach(function (g) { g.hidden = !g.querySelector('.list__item:not([hidden])'); });
      if (empty) empty.hidden = shown !== 0;
      if (clear) clear.hidden = sel.length === 0;
      if (status) status.textContent = sel.length ? shown + ' of ' + items.length : '';
      if (fromClick) {
        history.replaceState(null, '', sel.length ? '#' + sel.join('+') : location.pathname + location.search);
        if (main) { main.classList.remove('is-filtering'); void main.offsetWidth; main.classList.add('is-filtering'); }
      }
    }
    bar.addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('.filter');
      if (!b) return;
      if (b.hasAttribute('data-clear')) {
        buttons.forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      } else {
        b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      }
      apply(true);
    });
    /* read the selection from the hash: on load, and again when the hash
       changes without a reload (a pasted link in the same tab). Only known
       topic ids count, so a year anchor like #y2025 is left alone. */
    function fromHash() {
      var ids = buttons.map(function (b) { return b.getAttribute('data-topic'); });
      var want = location.hash.slice(1).split('+').filter(function (t) { return ids.indexOf(t) !== -1; });
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', want.indexOf(b.getAttribute('data-topic')) !== -1 ? 'true' : 'false'); });
    }
    window.addEventListener('hashchange', function () { fromHash(); apply(false); });
    fromHash();
    apply(false);
  })();
</script>

<script>
  /* Deck viewer on talk pages: page images rendered from the PDF, shown one at
     a time (see .deck in _skin.scss). Arrow keys work when the deck has focus,
     neighbours are preloaded so paging does not flash, and the end buttons
     disable at the ends. Without this script the first page is simply visible. */
  (function () {
    var decks = document.querySelectorAll('[data-deck]');
    Array.prototype.forEach.call(decks, function (deck) {
      var pages = deck.querySelectorAll('.deck__page');
      if (pages.length < 2) return;
      var prev = deck.querySelector('[data-deck-prev]');
      var next = deck.querySelector('[data-deck-next]');
      var label = deck.querySelector('[data-deck-current]');
      var cur = 0;

      function preload(i) {
        var img = pages[i];
        if (!img || img.getAttribute('data-preloaded')) return;
        var pre = new Image();
        pre.src = img.src;
        img.setAttribute('data-preloaded', '1');
      }
      function show(i) {
        if (i < 0 || i > pages.length - 1 || i === cur) return;
        /* inline display as well as [hidden]: an inline style beats any
           stylesheet, including a stale cached one */
        pages[cur].hidden = true;
        pages[cur].style.display = 'none';
        pages[i].hidden = false;
        pages[i].style.display = 'block';
        pages[i].removeAttribute('loading');
        cur = i;
        if (label) label.textContent = i + 1;
        if (prev) prev.disabled = i === 0;
        if (next) next.disabled = i === pages.length - 1;
        preload(i + 1);
        preload(i - 1);
      }

      deck.addEventListener('click', function (e) {
        if (!e.target.closest) return;
        if (e.target.closest('[data-deck-next]')) show(cur + 1);
        else if (e.target.closest('[data-deck-prev]')) show(cur - 1);
      });
      deck.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight' || e.key === 'PageDown') { show(cur + 1); e.preventDefault(); }
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(cur - 1); e.preventDefault(); }
        else if (e.key === 'Home') { show(0); e.preventDefault(); }
        else if (e.key === 'End') { show(pages.length - 1); e.preventDefault(); }
      });
      if (prev) prev.disabled = true;
      preload(1);
    });
  })();
</script>

<script>
  /* Lightbox: click any figure or slide page to see it large (see .lightbox in
     _skin.scss). Escape or a click on the backdrop closes it. Opened from a
     deck, the arrows page through the deck itself, so closing leaves the deck
     on the page you were looking at. */
  (function () {
    var SELECTOR = '.page__content .post-figure img, .deck__page';
    if (!document.querySelector(SELECTOR)) return;

    var box, img, caption, bar, prev, next, count, closeBtn, deck, lastFocus;

    function build() {
      box = document.createElement('div');
      box.className = 'lightbox';
      box.hidden = true;
      box.setAttribute('role', 'dialog');
      box.setAttribute('aria-modal', 'true');
      box.innerHTML =
        '<button type="button" class="lightbox__btn lightbox__btn--close" aria-label="Close">' +
        '<i class="fas fa-xmark" aria-hidden="true"></i></button>' +
        '<img class="lightbox__img" alt="">' +
        '<p class="lightbox__caption"></p>' +
        '<div class="lightbox__bar">' +
        '<button type="button" class="lightbox__btn" data-lb-prev aria-label="Previous page">' +
        '<i class="fas fa-chevron-left" aria-hidden="true"></i></button>' +
        '<span class="lightbox__count"></span>' +
        '<button type="button" class="lightbox__btn" data-lb-next aria-label="Next page">' +
        '<i class="fas fa-chevron-right" aria-hidden="true"></i></button>' +
        '</div>';
      document.body.appendChild(box);
      img = box.querySelector('.lightbox__img');
      caption = box.querySelector('.lightbox__caption');
      bar = box.querySelector('.lightbox__bar');
      prev = box.querySelector('[data-lb-prev]');
      next = box.querySelector('[data-lb-next]');
      count = box.querySelector('.lightbox__count');
      closeBtn = box.querySelector('.lightbox__btn--close');

      box.addEventListener('click', function (e) {
        var t = e.target;
        if (t.closest('[data-lb-next]')) { step(1); return; }
        if (t.closest('[data-lb-prev]')) { step(-1); return; }
        close();
      });
      document.addEventListener('keydown', function (e) {
        if (box.hidden) return;
        if (e.key === 'Escape') { close(); e.preventDefault(); }
        else if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
      });
    }

    /* page the underlying deck, then mirror whatever it now shows */
    function step(dir) {
      if (!deck) return;
      var btn = deck.querySelector(dir > 0 ? '[data-deck-next]' : '[data-deck-prev]');
      if (!btn || btn.disabled) return;
      btn.click();
      var shown = deck.querySelector('.deck__page:not([hidden])');
      if (shown) fill(shown);
      syncBar();
    }

    function syncBar() {
      if (!deck) { bar.hidden = true; bar.style.display = 'none'; return; }
      bar.hidden = false;
      bar.style.display = 'flex';
      var pages = deck.querySelectorAll('.deck__page');
      var shown = deck.querySelector('.deck__page:not([hidden])');
      var i = Array.prototype.indexOf.call(pages, shown);
      count.textContent = (i + 1) + ' / ' + pages.length;
      prev.disabled = i <= 0;
      next.disabled = i >= pages.length - 1;
    }

    function fill(source) {
      img.src = source.currentSrc || source.src;
      img.alt = source.getAttribute('alt') || '';
      /* never blow an image up past its own pixels: stretching is what makes a
         zoomed figure look soft */
      img.style.maxWidth = '100%';
      var cap = function () {
        if (img.naturalWidth) img.style.maxWidth = 'min(100%, ' + img.naturalWidth + 'px)';
      };
      if (img.complete) cap(); else img.onload = cap;
      var fig = source.closest('figure');
      var figcap = fig && fig.querySelector('figcaption');
      caption.textContent = figcap ? figcap.textContent.trim() : '';
      caption.hidden = !caption.textContent;
      caption.style.display = caption.textContent ? 'block' : 'none';
    }

    function open(source) {
      if (!box) build();
      deck = source.classList.contains('deck__page') ? source.closest('[data-deck]') : null;
      fill(source);
      syncBar();
      lastFocus = document.activeElement;
      box.hidden = false;
      document.body.style.overflow = 'hidden';
      closeBtn.focus();
    }

    function close() {
      if (!box || box.hidden) return;
      box.hidden = true;
      img.removeAttribute('src');
      document.body.style.overflow = '';
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    document.addEventListener('click', function (e) {
      var target = e.target.closest && e.target.closest(SELECTOR);
      if (!target) return;
      if (e.target.closest('a')) return; /* a linked figure keeps its link */
      open(target);
    });
  })();
</script>
