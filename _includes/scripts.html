<!-- main.min.js and theme-toggle.js are loaded with `defer` from head/custom.html.
     A synchronous external script here made Chrome ignore the render-blocking
     <link rel="expect"> marker, so the first paint happened before the bundle ran. -->

<script>
  /* Open links to other sites, and PDFs, in a new tab so readers keep this
     page. Runs at the end of <body>; changes no layout. */
  (function () {
    var host = location.hostname;
    var links = document.querySelectorAll('a[href]');
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      var external = /^https?:/i.test(a.getAttribute('href')) && a.hostname && a.hostname !== host;
      var pdf = /\.pdf(\?|#|$)/i.test(a.pathname || '');
      if ((external || pdf) && !a.target) {
        a.target = '_blank';
        a.rel = (a.rel ? a.rel + ' ' : '') + 'noopener';
      }
    }
  })();
</script>

<script>
  /* "Cite" buttons in publication lists: reveal the citation box under the row. */
  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('.pub__cite-toggle');
    if (!btn) return;
    var box = document.getElementById(btn.getAttribute('aria-controls'));
    if (!box) return;
    var open = box.hidden;
    box.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
  });
</script>
