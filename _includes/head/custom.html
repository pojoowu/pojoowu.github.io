{% include base_path %}

<!-- _includes/head/custom.html -->
<style>
  /* 1. Opt every page into cross-document view transitions. This must sit in the
        head of both the outgoing and the incoming document. */
  @view-transition {
    navigation: auto;
  }

  /* 2. Prevent horizontal jump from scrollbar toggle */
  html {
    scrollbar-gutter: stable;
    overflow-y: scroll;
  }
</style>

<!-- 3. Hold the first paint, and therefore the view-transition capture of the new
        page, until #page-ready at the end of <body> has been parsed, so the whole
        page is laid out before it is shown. Nothing that runs later may change
        the layout: the scripts are deferred and must not move things (the
        mobile header is CSS-only, the footer is CSS-only). A synchronous
        external jQuery bundle makes Chrome drop this marker, so keep `defer`. -->
<link rel="expect" href="#page-ready" blocking="render">
<script defer src="{{ base_path }}/assets/js/main.min.js"></script>
<script defer src="{{ base_path }}/assets/js/theme-toggle.js"></script>
<link rel="preload" href="{{ base_path }}/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- Icon fonts too: otherwise the icons arrive one frame after the first paint
     and pop in during the transition (Font Awesome uses font-display: block). -->
<link rel="preload" href="{{ base_path }}/assets/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ base_path }}/assets/webfonts/fa-brands-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ base_path }}/assets/fonts/academicons.woff" as="font" type="font/woff" crossorigin>

<!-- Transition styling (the early theme script lives in head.html, before main.css) -->
<link rel="stylesheet" href="{{ '/assets/css/transitions.css' | relative_url }}">

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f3"/>
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1116"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

{% if page.math or content contains "$" or content contains "\(" %}
<!-- MathJax, only on pages that contain math (or set `math: true`).
     Single dollars are accepted for inline math (kramdown leaves them
     untouched, MathJax picks them up); \$ escapes a literal dollar sign. -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
<script type="speculationrules">
{"prerender":[{
  "where":{"and":[
    {"href_matches":"/*"},
    {"not":{"href_matches":"/files/*"}}
  ]},
  "eagerness":"moderate"
}]}
</script>
<!-- end custom head snippets -->
