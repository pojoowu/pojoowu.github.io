# Re-render files/yu-han-wu-cv.pdf from the /cv/ page whenever the content it
# is built from changes on master, and commit the new PDF back. GitHub Pages
# then deploys master as usual. (Pushes made with the workflow token do not
# trigger workflows, so this cannot loop.)
name: CV PDF

on:
  push:
    branches: [master]
    paths:
      - _pages/cv.md
      - _publications/**
      - _talks/**
      - _config.yml
      - _sass/**
      - _includes/**
      - _layouts/**
      - .github/workflows/cv-pdf.yml
      - .github/scripts/cv-pdf.js
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cv-pdf
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build the site for a local server
        run: |
          printf 'url: http://localhost:4000\n' > /tmp/local.yml
          JEKYLL_ENV=production bundle exec jekyll build --config _config.yml,/tmp/local.yml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install puppeteer (bundles Chrome)
        run: npm install --no-save --no-audit --no-fund puppeteer@23

      - name: Render /cv/ to PDF
        run: |
          (cd _site && python3 -m http.server 4000 >/dev/null 2>&1 &)
          sleep 2
          BASE_URL=http://localhost:4000 OUT=files/yu-han-wu-cv.pdf node .github/scripts/cv-pdf.js

      - name: Commit the PDF if it changed
        run: |
          if git diff --quiet -- files/yu-han-wu-cv.pdf && [ -z "$(git status --porcelain -- files/yu-han-wu-cv.pdf)" ]; then
            echo "PDF unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/yu-han-wu-cv.pdf
          git commit -m "CV: re-render PDF from /cv/"
          git push
